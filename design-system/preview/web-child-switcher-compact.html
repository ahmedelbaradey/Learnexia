<!doctype html>
<!-- @dsCard group="Components" name="Web · Child Switcher (compact)" subtitle="Header pill — circle avatar + first name + chevron; closed & open" viewport="340x300" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body style="padding:16px;background:#0F172A">
<div style="display:flex;flex-direction:column;gap:14px;font-family:var(--lx-font-display)">
  <div style="font-size:10px;font-weight:700;color:#64748B;letter-spacing:0.08em;text-transform:uppercase">Closed</div>
  <button style="align-self:flex-start;display:flex;align-items:center;gap:8px;background:#1E293B;border:1px solid rgba(255,255,255,0.08);border-radius:9999px;padding:5px 12px 5px 6px;cursor:pointer;font-family:inherit">
    <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#FB923C,#EF4444);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff">S</div>
    <span style="font-size:13px;font-weight:700;color:#F8FAFC">Sami</span>
    <span style="color:#94A3B8;font-size:12px">⌄</span>
  </button>
  <div style="font-size:10px;font-weight:700;color:#64748B;letter-spacing:0.08em;text-transform:uppercase;margin-top:4px">Open</div>
  <div style="width:230px;background:#1E293B;border:1px solid rgba(255,255,255,0.1);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,0.5);padding:6px;display:flex;flex-direction:column;gap:2px">
    <button style="display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;background:rgba(79,70,229,0.18);border:none;cursor:pointer;font-family:inherit;text-align:left"><div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#FB923C,#EF4444);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff">S</div><span style="flex:1;font-size:13px;font-weight:700;color:#F8FAFC">Sami</span><span style="color:#A5B4FC;font-size:13px">✓</span></button>
    <button style="display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left"><div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#A855F7,#6366F1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff">L</div><span style="flex:1;font-size:13px;font-weight:700;color:#F8FAFC">Layla</span></button>
    <button style="display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left"><div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#22C55E,#0EA5E9);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff">Y</div><span style="flex:1;font-size:13px;font-weight:700;color:#F8FAFC">Yusuf</span></button>
  </div>
</div>
</body></html>
