<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body style="padding:24px">
<div style="max-width:380px;margin:0 auto;font-family:var(--lx-font-display)">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">📈</span><span style="font-weight:700;font-size:17px;color:#CBD5E1">Level 5 → 6</span></div>
    <div style="font-weight:700;font-size:17px;color:#CBD5E1;font-variant-numeric:tabular-nums">850 / 1000 XP</div>
  </div>
  <div style="height:12px;background:#1E2030;border-radius:9999px;overflow:hidden"><div style="height:100%;width:85%;background:linear-gradient(90deg,#22C55E,#4F46E5);box-shadow:inset 0 1px 0 rgba(255,255,255,0.3);border-radius:9999px"></div></div>
  <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:#94A3B8"><span>85% to next level</span><span style="font-variant-numeric:tabular-nums">150 XP left</span></div>
</div>
