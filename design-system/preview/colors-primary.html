<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:24px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{border-radius:16px;padding:16px;height:120px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-family:var(--lx-font-body);box-shadow:var(--lx-shadow-card)}
  .sw .name{font-weight:700;font-size:14px}
  .sw .hex{font-family:var(--lx-font-mono);font-size:12px;opacity:0.9}
  .sw .use{font-size:11px;opacity:0.85}
</style></head>
<body>
<div class="grid">
  <div class="sw" style="background:#4F46E5"><div><div class="name">Primary</div><div class="use">CTA · focus · active</div></div><div class="hex">#4F46E5</div></div>
  <div class="sw" style="background:#22C55E"><div><div class="name">Success</div><div class="use">correct · earned</div></div><div class="hex">#22C55E</div></div>
  <div class="sw" style="background:#F59E0B"><div><div class="name">Warning</div><div class="use">low hearts · careful</div></div><div class="hex">#F59E0B</div></div>
  <div class="sw" style="background:#EF4444"><div><div class="name">Danger</div><div class="use">wrong · life lost</div></div><div class="hex">#EF4444</div></div>
</div>
</body></html>
