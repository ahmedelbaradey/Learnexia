<!doctype html>
<!-- @dsCard group="Components" name="Web · Hero Phone Mock" subtitle="Tilted phone with floating reward chips" viewport="700x520" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body style="padding:32px;display:flex;justify-content:center">
<div style="position:relative;display:flex;justify-content:center;font-family:var(--lx-font-display)">
  <div style="width:220px;height:440px;border-radius:32px;background:linear-gradient(165deg,#A855F7 0%,#4F46E5 50%,#1E293B 100%);border:6px solid #1a1a1a;box-shadow:0 32px 80px rgba(99,102,241,0.5);display:flex;flex-direction:column;padding:18px;gap:12px;transform:rotate(-4deg);color:#fff">
    <div style="display:flex;align-items:center;justify-content:space-between"><div style="font-weight:900;font-size:16px">Sami</div><div style="padding:3px 8px;border-radius:9999px;background:rgba(251,146,60,0.2);color:#FB923C;font-weight:800;font-size:10px">🔥 7</div></div>
    <div style="background:rgba(0,0,0,0.3);border-radius:14px;padding:10px"><div style="font-size:9px;font-weight:700;color:#FACC15;letter-spacing:0.1em;text-transform:uppercase">Continue learning</div><div style="font-weight:900;font-size:14px;margin-top:4px">Fractions</div><div style="height:5px;background:rgba(0,0,0,0.4);border-radius:9999px;margin-top:8px;overflow:hidden"><div style="height:100%;width:60%;background:linear-gradient(90deg,#22C55E,#FACC15)"></div></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="background:rgba(0,0,0,0.3);border-radius:12px;padding:10px;font-size:22px">🧮</div><div style="background:rgba(0,0,0,0.3);border-radius:12px;padding:10px;font-size:22px">🧪</div><div style="background:rgba(0,0,0,0.3);border-radius:12px;padding:10px;font-size:22px">📖</div><div style="background:rgba(0,0,0,0.3);border-radius:12px;padding:10px;font-size:22px">🇬🇧</div></div>
    <div style="margin-top:auto;text-align:center;font-size:26px">🌟</div>
  </div>
  <div style="position:absolute;top:50px;right:-20px;background:#22C55E;color:#0F172A;font-weight:800;font-size:11px;padding:6px 12px;border-radius:9999px;box-shadow:0 8px 24px rgba(34,197,94,0.4);transform:rotate(8deg)">+50 XP ⭐</div>
  <div style="position:absolute;bottom:70px;left:-30px;background:rgba(15,23,42,0.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);color:#fff;font-weight:700;font-size:10px;padding:8px 12px;border-radius:14px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,0.4);transform:rotate(-4deg)"><span style="font-size:14px">🏆</span> New badge!</div>
</div>
</body></html>
