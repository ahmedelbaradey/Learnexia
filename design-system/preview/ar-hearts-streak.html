<!doctype html>
<!-- @dsCard group="Components" name="AR · Hearts & Streak" subtitle="Hearts + streak panels (RTL)" viewport="700x200" -->
<html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="_base-ar.css">
<style>
  body{padding:28px;display:flex;gap:20px;font-family:'Tajawal'}
  .panel{flex:1;background:#1E293B;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .ttl{font-family:'Cairo';font-weight:700;font-size:13px;color:#94A3B8;letter-spacing:0.04em}
  .hearts{display:flex;gap:8px;font-size:30px}
  .lost{filter:grayscale(1) opacity(0.35)}
</style></head>
<body>
<div class="panel">
  <div class="ttl">القلوب</div>
  <div class="hearts"><span>❤️</span><span>❤️</span><span>❤️</span><span class="lost">❤️</span><span class="lost">❤️</span></div>
  <div style="font-size:13px;color:#CBD5E1">٣ من ٥ متبقية — تتجدد بعد <b style="color:#F59E0B">٢٣ دقيقة</b></div>
</div>
<div class="panel">
  <div class="ttl">السلسلة</div>
  <div style="display:flex;align-items:center;gap:14px">
    <div style="font-size:48px;filter:drop-shadow(0 0 14px rgba(251,146,60,0.7))">🔥</div>
    <div><div style="font-family:'Cairo';font-weight:800;font-size:32px;color:#FB923C;line-height:1">٧ أيام</div><div style="font-size:12px;color:#94A3B8;margin-top:2px">حافظ على سلسلتك!</div></div>
  </div>
</div>
</body></html>
