<html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="_base-ar.css"></head>
<body style="padding:28px">
<div style="display:flex;gap:14px;align-items:flex-end;max-width:600px;margin:0 auto">

      <button style="font-family:'Cairo';font-size:12px;font-weight:600;background:rgba(79,70,229,0.18);color:#A5B4FC;padding:5px 10px;border-radius:9999px;border:1px solid rgba(99,102,241,0.3);cursor:pointer">تخطي</button>
