<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Helper Energy" subtitle="Teal AI-help meter · deliberately not heart-rose or gem-sky" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:24px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sw{border-radius:16px;padding:14px;height:120px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--lx-font-body);box-shadow:var(--lx-shadow-card)}
  .sw .name{font-weight:800;font-size:13px}
  .sw .hex{font-family:var(--lx-font-mono);font-size:11px;opacity:0.85}
  .sw .icon{font-size:22px}
  .dark{color:#F8FAFC;border:1px solid rgba(255,255,255,0.08)}
</style></head>
<body>
<div class="grid">
  <div class="sw" style="background:#2DD4BF;color:#0F172A"><div class="icon">⚡</div><div><div class="name">Energy</div><div class="hex">#2DD4BF</div></div></div>
  <div class="sw" style="background:#14B8A6;color:#0F172A"><div class="icon">🔋</div><div><div class="name">Energy Deep</div><div class="hex">#14B8A6</div></div></div>
  <div class="sw dark" style="background:rgba(45,212,191,0.18)"><div class="icon">⚡</div><div><div class="name">Energy Soft</div><div class="hex">rgba(45,212,191,.18)</div></div></div>
  <div class="sw dark" style="background:#0F172A;box-shadow:0 0 18px rgba(45,212,191,0.5),var(--lx-shadow-card)"><div class="icon" style="filter:drop-shadow(0 0 8px rgba(45,212,191,0.9))">⚡</div><div><div class="name">Energy Glow</div><div class="hex">rgba(45,212,191,.5)</div></div></div>
</div>
</body></html>
