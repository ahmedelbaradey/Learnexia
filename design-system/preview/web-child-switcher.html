<!doctype html>
<!-- @dsCard group="Components" name="Web · Child Switcher (open)" subtitle="Sidebar family switcher unfolded — switch child, active ✓, add a child" viewport="280x340" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body style="padding:16px;background:#0F172A">
<div style="position:relative;width:240px;font-family:var(--lx-font-display)">
  <button style="width:100%;background:#1E293B;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;border:1px solid rgba(99,102,241,0.6);font-family:inherit;text-align:left;cursor:pointer">
    <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#FB923C,#EF4444);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff">S</div>
    <div style="flex:1"><div style="font-weight:700;font-size:13px;color:#F8FAFC">Sami</div><div style="font-size:11px;color:#94A3B8">Grade 3 · Level 12</div></div>
    <div style="color:#94A3B8;font-size:13px;transform:rotate(90deg)">›</div>
  </button>
  <div style="margin-top:8px;background:#1E293B;border:1px solid rgba(255,255,255,0.1);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,0.55);padding:8px;display:flex;flex-direction:column;gap:2px">
    <div style="font-size:10px;font-weight:800;color:#64748B;letter-spacing:0.1em;text-transform:uppercase;padding:6px 10px 4px">Switch child</div>
    <button style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(79,70,229,0.18);border:none;cursor:pointer;font-family:inherit;text-align:left">
      <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#FB923C,#EF4444);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff">S</div>
      <div style="flex:1"><div style="font-weight:700;font-size:13px;color:#F8FAFC">Sami</div><div style="font-size:11px;color:#94A3B8">Grade 3 · Level 12</div></div><span style="color:#A5B4FC;font-size:14px">✓</span>
    </button>
    <button style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left">
      <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#A855F7,#6366F1);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff">L</div>
      <div style="flex:1"><div style="font-weight:700;font-size:13px;color:#F8FAFC">Layla</div><div style="font-size:11px;color:#94A3B8">Grade 5 · Level 20</div></div>
    </button>
    <button style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left">
      <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#22C55E,#0EA5E9);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff">Y</div>
      <div style="flex:1"><div style="font-weight:700;font-size:13px;color:#F8FAFC">Yusuf</div><div style="font-size:11px;color:#94A3B8">Grade 1 · Level 4</div></div>
    </button>
    <div style="height:1px;background:rgba(255,255,255,0.07);margin:6px 4px"></div>
    <button style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left;color:#A5B4FC;font-weight:700;font-size:13px">
      <span style="width:32px;height:32px;border-radius:50%;border:1.5px dashed rgba(165,180,252,0.5);display:flex;align-items:center;justify-content:center;font-size:16px">＋</span>Add a child
    </button>
  </div>
</div>
</body></html>
