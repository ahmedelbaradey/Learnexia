<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body style="padding:24px;max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;font-family:var(--lx-font-display)">
<div style="background:#1E293B;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px">
  <div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.08em">Time learning</div><div style="width:32px;height:32px;border-radius:10px;background:rgba(79,70,229,0.13);color:#4F46E5;display:flex;align-items:center;justify-content:center;font-size:15px">⏱️</div></div>
  <div style="font-weight:800;font-size:28px;color:#F8FAFC;font-variant-numeric:tabular-nums;line-height:1">3h 24m</div>
  <div style="font-size:12px;font-weight:700;color:#22C55E">+42m vs last week</div>
</div>
<div style="background:#1E293B;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px">
  <div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.08em">XP earned</div><div style="width:32px;height:32px;border-radius:10px;background:rgba(250,204,21,0.13);color:#FACC15;display:flex;align-items:center;justify-content:center;font-size:15px">⭐</div></div>
  <div style="font-weight:800;font-size:28px;color:#F8FAFC;font-variant-numeric:tabular-nums;line-height:1">480</div>
  <div style="font-size:12px;font-weight:700;color:#22C55E">+28% vs last week</div>
</div>
<div style="background:#1E293B;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px">
  <div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.08em">Lessons done</div><div style="width:32px;height:32px;border-radius:10px;background:rgba(34,197,94,0.13);color:#22C55E;display:flex;align-items:center;justify-content:center;font-size:15px">✓</div></div>
  <div style="font-weight:800;font-size:28px;color:#F8FAFC;font-variant-numeric:tabular-nums;line-height:1">14</div>
  <div style="font-size:12px;font-weight:700;color:#22C55E">+3 vs last week</div>
</div>
<div style="background:#1E293B;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px">
  <div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.08em">Day streak</div><div style="width:32px;height:32px;border-radius:10px;background:rgba(251,146,60,0.13);color:#FB923C;display:flex;align-items:center;justify-content:center;font-size:15px">🔥</div></div>
  <div style="font-weight:800;font-size:28px;color:#F8FAFC;font-variant-numeric:tabular-nums;line-height:1">7</div>
  <div style="font-size:12px;font-weight:700;color:#22C55E">+1 vs last week</div>
</div>
</body></html>
