<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:24px;background:#0a1020}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sw{border-radius:16px;padding:18px;height:130px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-family:var(--lx-font-body);border:1px solid var(--lx-border)}
  .sw .name{font-weight:700;font-size:14px}
  .sw .hex{font-family:var(--lx-font-mono);font-size:12px;color:var(--lx-fg3)}
  .sw .use{font-size:11px;color:var(--lx-fg3)}
</style></head>
<body>
<div class="grid">
  <div class="sw" style="background:#0F172A"><div><div class="name">Main BG</div><div class="use">app canvas</div></div><div class="hex">#0F172A</div></div>
  <div class="sw" style="background:#1E293B"><div><div class="name">Card</div><div class="use">default surface</div></div><div class="hex">#1E293B</div></div>
  <div class="sw" style="background:#334155"><div><div class="name">Soft Card</div><div class="use">nested · hover lift</div></div><div class="hex">#334155</div></div>
</div>
</body></html>
