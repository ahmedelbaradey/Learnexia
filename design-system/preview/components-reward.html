<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:0;min-height:340px;background:radial-gradient(circle at 50% 40%,rgba(79,70,229,0.5),#0F172A 70%);display:flex;align-items:center;justify-content:center}
  .pop{background:rgba(30,41,59,0.85);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:28px;padding:24px 32px;text-align:center;box-shadow:var(--lx-shadow-popup),0 0 60px rgba(250,204,21,0.25);min-width:280px}
  .badge{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FDE68A,#F59E0B);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 0 36px rgba(250,204,21,0.6),inset 0 -6px 12px rgba(0,0,0,0.2)}
  .ttl{font-family:var(--lx-font-display);font-weight:800;font-size:26px;color:var(--lx-fg1);margin-bottom:4px}
  .sub{font-size:14px;color:var(--lx-fg2);margin-bottom:14px}
  .xp{font-family:var(--lx-font-display);font-weight:900;font-size:36px;color:var(--lx-xp);text-shadow:0 0 18px rgba(250,204,21,0.5)}
  .btn{margin-top:14px;height:44px;padding:0 28px;border-radius:9999px;border:none;background:#4F46E5;color:#fff;font-family:var(--lx-font-display);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 18px rgba(99,102,241,0.45)}
</style></head>
<body>
<div class="pop">
  <div class="badge">🏆</div>
  <div class="ttl">Lesson Complete!</div>
  <div class="sub">Streak protected · Hearts saved</div>
  <div class="xp">+50 XP</div>
  <button class="btn">Keep Going</button>
</div>
</body></html>
