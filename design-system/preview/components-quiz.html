<!doctype html>
<!-- @dsCard group="Components" name="Quiz Answers" subtitle="Default / selected / correct / wrong" viewport="700x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:28px}
  .q{font-family:var(--lx-font-display);font-weight:800;font-size:20px;color:var(--lx-fg1);margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .ans{background:#1E293B;border:2px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px 16px;font-family:var(--lx-font-display);font-weight:600;font-size:16px;color:var(--lx-fg1);display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all 180ms var(--lx-ease-out)}
  .ans .key{font-family:var(--lx-font-mono);font-size:11px;color:var(--lx-fg3);background:rgba(255,255,255,0.06);padding:2px 7px;border-radius:6px}
  .selected{border-color:#4F46E5;background:rgba(79,70,229,0.15)}
  .correct{border-color:#22C55E;background:rgba(34,197,94,0.15);color:#22C55E}
  .wrong{border-color:#EF4444;background:rgba(239,68,68,0.15);color:#EF4444}
</style></head>
<body>
<div class="q">Which number is bigger?</div>
<div class="grid">
  <div class="ans"><span>27</span><span class="key">A</span></div>
  <div class="ans selected"><span>54</span><span class="key">B</span></div>
  <div class="ans correct"><span>89 ✓</span><span class="key">C</span></div>
  <div class="ans wrong"><span>12 ✗</span><span class="key">D</span></div>
</div>
</body></html>
