<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .btn{height:52px;border-radius:9999px;border:none;font-family:var(--lx-font-display);font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:0.01em;transition:transform 120ms var(--lx-ease-out)}
  .btn:active{transform:scale(0.96)}
  .primary{background:#4F46E5;color:#fff;box-shadow:0 6px 18px rgba(99,102,241,0.45),inset 0 1px 0 rgba(255,255,255,0.2)}
  .success{background:#22C55E;color:#0F172A;box-shadow:0 6px 18px rgba(34,197,94,0.35),inset 0 1px 0 rgba(255,255,255,0.25)}
  .danger{background:#EF4444;color:#fff;box-shadow:0 6px 18px rgba(239,68,68,0.4),inset 0 1px 0 rgba(255,255,255,0.2)}
  .secondary{background:#334155;color:#F8FAFC;border:1px solid rgba(255,255,255,0.1)}
  .ghost{background:transparent;color:#CBD5E1;border:1px solid rgba(255,255,255,0.16)}
  .disabled{background:#1E293B;color:#64748B;cursor:not-allowed}
</style></head>
<body style="padding:28px">
<div class="grid">
  <button class="btn primary">Start Lesson</button>
  <button class="btn success">Continue</button>
  <button class="btn danger">Give Up</button>
  <button class="btn secondary">Skip</button>
  <button class="btn ghost">Maybe later</button>
  <button class="btn disabled">Locked</button>
</div>
</body></html>
