<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:28px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:14px;background:#1E293B;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:14px 16px}
  .ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .body{flex:1}
  .ttl{font-family:var(--lx-font-display);font-weight:700;font-size:15px;color:var(--lx-fg1)}
  .sub{font-size:12px;color:var(--lx-fg3);margin-top:2px}
  .bar{height:6px;background:#0F172A;border-radius:9999px;overflow:hidden;margin-top:8px;border:1px solid rgba(255,255,255,0.04)}
  .fill{height:100%;background:linear-gradient(90deg,#FACC15,#FB923C)}
  .reward{display:flex;align-items:center;gap:4px;font-family:var(--lx-font-display);font-weight:800;color:var(--lx-xp);font-size:14px;background:rgba(250,204,21,0.15);padding:6px 10px;border-radius:9999px}
  .done .ico{background:rgba(34,197,94,0.2)}
  .done .reward{color:#22C55E;background:rgba(34,197,94,0.18)}
</style></head>
<body>
<div class="row done">
  <div class="ico" style="background:rgba(34,197,94,0.2)">✓</div>
  <div class="body"><div class="ttl">Finish 1 lesson</div><div class="sub">Completed</div><div class="bar"><div class="fill" style="width:100%;background:#22C55E"></div></div></div>
  <div class="reward">⭐ +20</div>
</div>
<div class="row">
  <div class="ico" style="background:rgba(79,70,229,0.2)">🎯</div>
  <div class="body"><div class="ttl">Get 10 questions right in a row</div><div class="sub">6 of 10</div><div class="bar"><div class="fill" style="width:60%"></div></div></div>
  <div class="reward">⭐ +50</div>
</div>
<div class="row">
  <div class="ico" style="background:rgba(251,146,60,0.2)">🔥</div>
  <div class="body"><div class="ttl">Practice 3 days in a row</div><div class="sub">2 of 3</div><div class="bar"><div class="fill" style="width:66%;background:linear-gradient(90deg,#FB923C,#EF4444)"></div></div></div>
  <div class="reward">⭐ +30</div>
</div>
</body></html>
