<!doctype html>

<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body style="padding:24px">

    <div style="font-size:9px;color:#94A3B8;text-transform:uppercase;letter-spacing:0.06em;font-weight:700">Earned</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:20px;background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.3)">
    <div style="width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FBCFE8,#A855F7 55%,#4F46E5);box-shadow:0 0 24px rgba(168,85,247,0.6);display:flex;align-items:center;justify-content:center;font-size:26px">👑</div>
    <div style="font-weight:700;font-size:12px;color:#F8FAFC;text-align:center">All-Star</div>
    <div style="font-size:9px;color:#A855F7;text-transform:uppercase;letter-spacing:0.06em;font-weight:700">Top 1%</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:20px;background:#1E293B;border:1px solid rgba(255,255,255,0.04)">
    <div style="width:64px;height:64px;border-radius:50%;background:#334155;color:#64748B;display:flex;align-items:center;justify-content:center;font-size:26px">🔒</div>
    <div style="font-weight:700;font-size:12px;color:#64748B;text-align:center">Science Pro</div>
    <div style="font-size:9px;color:#94A3B8;text-transform:uppercase;letter-spacing:0.06em;font-weight:700">Locked</div>
  </div>
</div>
