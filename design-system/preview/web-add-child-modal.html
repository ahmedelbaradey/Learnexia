<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body style="padding:0;min-height:560px;background:#0a1020;display:flex;align-items:center;justify-content:center">
<!-- scrim -->
<div style="position:absolute;inset:0;background:rgba(5,8,22,0.7);backdrop-filter:blur(4px)"></div>
<!-- modal -->
<div style="position:relative;width:480px;background:#15161D;border-radius:24px;border:1px solid rgba(255,255,255,0.08);box-shadow:0 24px 64px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.06);overflow:hidden;font-family:var(--lx-font-body)">
  <!-- header -->
  <div style="padding:22px 24px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,0.05)">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#A855F7,#6366F1);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 16px rgba(99,102,241,0.4)">👶</div>
      <div><div style="font-family:var(--lx-font-display);font-weight:800;font-size:18px;color:#F8FAFC">Add a child</div><div style="font-size:12px;color:#94A3B8;margin-top:2px">They'll log in with the email you set</div></div>
    </div>
    <button style="width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,0.05);border:none;color:#94A3B8;font-size:18px;cursor:pointer">✕</button>
  </div>
  <!-- body -->
  <div style="padding:20px 24px;display:flex;flex-direction:column;gap:16px">
    <!-- photo upload -->
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:64px;height:64px;border-radius:50%;background:#A855F7;display:flex;align-items:center;justify-content:center;font-family:var(--lx-font-display);font-weight:900;font-size:26px;color:#fff;flex-shrink:0;position:relative;box-shadow:inset 0 -2px 4px rgba(0,0,0,0.2)">L<div style="position:absolute;bottom:-2px;right:-2px;width:24px;height:24px;border-radius:50%;background:#4F46E5;border:2px solid #15161D;display:flex;align-items:center;justify-content:center;font-size:11px">📷</div></div>
      <div style="flex:1;border:1.5px dashed rgba(99,102,241,0.45);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:rgba(79,70,229,0.05)">
        <span style="font-size:20px">⬆️</span>
        <div><div style="font-family:var(--lx-font-display);font-weight:700;font-size:13px;color:#A5B4FC">Upload a photo</div><div style="font-size:11px;color:#94A3B8;margin-top:1px">PNG or JPG · or pick a color below</div></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px"><label style="font-family:var(--lx-font-display);font-weight:700;font-size:12px;color:#CBD5E1">Child's name</label><div style="height:46px;background:#0B0C12;border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#F8FAFC;font-size:15px;padding:0 14px;display:flex;align-items:center">Layla</div></div>
    <div style="display:flex;flex-direction:column;gap:6px"><label style="font-family:var(--lx-font-display);font-weight:700;font-size:12px;color:#CBD5E1">Login email</label><div style="height:46px;background:#0B0C12;border:1px solid #4F46E5;box-shadow:0 0 0 3px rgba(99,102,241,0.2);border-radius:12px;color:#F8FAFC;font-size:15px;padding:0 14px;display:flex;align-items:center">layla@learnexia.com</div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><label style="font-family:var(--lx-font-display);font-weight:700;font-size:12px;color:#CBD5E1">Grade</label>
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px">
        <div style="height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:linear-gradient(135deg,#A855F7,#6366F1);box-shadow:0 4px 12px rgba(99,102,241,0.4)"><span style="font-size:15px">🌱</span><span style="font-family:var(--lx-font-display);font-weight:800;font-size:11px;color:#fff">1</span></div>
        <div style="height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#0B0C12;border:1px solid rgba(255,255,255,0.1)"><span style="font-size:15px">🌿</span><span style="font-family:var(--lx-font-display);font-weight:800;font-size:11px;color:#94A3B8">2</span></div>
        <div style="height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#0B0C12;border:1px solid rgba(255,255,255,0.1)"><span style="font-size:15px">🌳</span><span style="font-family:var(--lx-font-display);font-weight:800;font-size:11px;color:#94A3B8">3</span></div>
        <div style="height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#0B0C12;border:1px solid rgba(255,255,255,0.1)"><span style="font-size:15px">🌲</span><span style="font-family:var(--lx-font-display);font-weight:800;font-size:11px;color:#94A3B8">4</span></div>
        <div style="height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#0B0C12;border:1px solid rgba(255,255,255,0.1)"><span style="font-size:15px">🍃</span><span style="font-family:var(--lx-font-display);font-weight:800;font-size:11px;color:#94A3B8">5</span></div>
        <div style="height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#0B0C12;border:1px solid rgba(255,255,255,0.1)"><span style="font-size:15px">🌴</span><span style="font-family:var(--lx-font-display);font-weight:800;font-size:11px;color:#94A3B8">6</span></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px"><label style="font-family:var(--lx-font-display);font-weight:700;font-size:12px;color:#CBD5E1">Language</label>
      <div style="display:flex;gap:8px">
        <div style="flex:1;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(79,70,229,0.18);border:1.5px solid #4F46E5"><span style="font-size:20px">🇪🇬</span><span style="font-family:var(--lx-font-display);font-weight:700;font-size:14px;color:#F8FAFC">AR</span></div>
        <div style="flex:1;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;background:#0B0C12;border:1px solid rgba(255,255,255,0.1)"><span style="font-size:20px">🇺🇸</span><span style="font-family:var(--lx-font-display);font-weight:700;font-size:14px;color:#94A3B8">EN</span></div>
      </div>
    </div>
    <!-- avatar color -->
    <div style="display:flex;flex-direction:column;gap:8px"><label style="font-family:var(--lx-font-display);font-weight:700;font-size:12px;color:#CBD5E1">…or pick an avatar color</label>
      <div style="display:flex;gap:10px">
        <div style="width:36px;height:36px;border-radius:50%;background:#FB923C"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#A855F7;box-shadow:0 0 0 3px #15161D,0 0 0 5px #A855F7"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#22C55E"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#38BDF8"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#FB7185"></div>
      </div>
    </div>
  </div>
  <!-- footer -->
  <div style="padding:16px 24px 22px;display:flex;gap:10px;border-top:1px solid rgba(255,255,255,0.05)">
    <button style="flex:1;height:48px;border-radius:14px;background:transparent;border:1px solid rgba(255,255,255,0.12);color:#CBD5E1;font-family:var(--lx-font-display);font-weight:700;font-size:15px;cursor:pointer">Cancel</button>
    <button style="flex:2;height:48px;border-radius:14px;background:#4F46E5;border:none;color:#fff;font-family:var(--lx-font-display);font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 12px rgba(99,102,241,0.4),inset 0 1px 0 rgba(255,255,255,0.2)">Add Layla →</button>
  </div>
</div>
</body></html>
