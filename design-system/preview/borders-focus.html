<!doctype html>
<!-- @dsCard group="Spacing" name="Borders & Focus" subtitle="Low-alpha borders + indigo focus ring" viewport="700x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .row{display:flex;gap:14px;align-items:stretch}
  .item{flex:1;display:flex;flex-direction:column;gap:8px}
  .demo{height:60px;border-radius:16px;background:#1E293B;display:flex;align-items:center;padding:0 16px;color:var(--lx-fg2);font-size:14px}
  .label{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--lx-fg3);font-weight:600}
</style></head>
<body style="padding:28px">
<div class="row">
  <div class="item"><div class="demo" style="border:1px solid rgba(255,255,255,0.08)">Default border</div><div class="label">1px · α 0.08</div></div>
  <div class="item"><div class="demo" style="border:1px solid rgba(255,255,255,0.16)">Strong border</div><div class="label">1px · α 0.16</div></div>
  <div class="item"><div class="demo" style="outline:2px solid #4F46E5;outline-offset:0;box-shadow:0 0 0 6px rgba(99,102,241,0.35)">Focused input</div><div class="label">Focus ring</div></div>
</div>
</body></html>
