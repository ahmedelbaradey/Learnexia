<!doctype html>
<!-- @dsCard group="Components" name="Hearts & Streak" subtitle="Life and streak flame displays" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:28px;display:flex;gap:20px}
  .panel{flex:1;background:#1E293B;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .ttl{font-family:var(--lx-font-display);font-weight:700;font-size:13px;color:var(--lx-fg3);text-transform:uppercase;letter-spacing:0.06em}
  .hearts{display:flex;gap:8px;font-size:30px}
  .lost{filter:grayscale(1) opacity(0.35)}
  .streakbig{display:flex;align-items:center;gap:14px}
  .flame{font-size:48px;filter:drop-shadow(0 0 14px rgba(251,146,60,0.7))}
  .num{font-family:var(--lx-font-display);font-weight:800;font-size:36px;color:var(--lx-streak);line-height:1}
  .meta{font-size:12px;color:var(--lx-fg3);margin-top:2px}
</style></head>
<body>
<div class="panel">
  <div class="ttl">Hearts</div>
  <div class="hearts">
    <span>❤️</span><span>❤️</span><span>❤️</span><span class="lost">❤️</span><span class="lost">❤️</span>
  </div>
  <div style="font-size:13px;color:var(--lx-fg2)">3 of 5 left — refill in <b style="color:var(--lx-warning)">23 min</b></div>
</div>
<div class="panel">
  <div class="ttl">Streak</div>
  <div class="streakbig">
    <div class="flame">🔥</div>
    <div><div class="num">7 days</div><div class="meta">Keep it alive!</div></div>
  </div>
</div>
</body></html>
