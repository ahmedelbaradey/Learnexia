<!doctype html>
<!-- @dsCard group="Type" name="Type — Numbers" subtitle="Chunky tabular numerals for XP / streak" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body style="padding:28px">
<div style="display:flex;gap:24px;align-items:center;justify-content:space-around">
  <div style="text-align:center">
    <div style="font-family:var(--lx-font-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:var(--lx-xp);text-shadow:0 0 20px rgba(250,204,21,0.4)">+50</div>
    <div class="muted" style="margin-top:6px">XP earned</div>
  </div>
  <div style="text-align:center">
    <div style="font-family:var(--lx-font-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:var(--lx-streak)">7</div>
    <div class="muted" style="margin-top:6px">Day streak</div>
  </div>
  <div style="text-align:center">
    <div style="font-family:var(--lx-font-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:var(--lx-fg1)">Lv 12</div>
    <div class="muted" style="margin-top:6px">Player level</div>
  </div>
</div>
</body></html>
