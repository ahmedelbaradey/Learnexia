<!doctype html>
<!-- @dsCard group="Components" name="XP Bar" subtitle="Three progress states + level-up glow" viewport="700x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:28px}
  .item{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .head{display:flex;justify-content:space-between;font-family:var(--lx-font-display);font-weight:700;font-size:13px;color:var(--lx-fg2)}
  .num{color:var(--lx-xp);font-variant-numeric:tabular-nums}
  .bar{height:14px;background:#1E293B;border-radius:9999px;overflow:hidden;border:1px solid rgba(255,255,255,0.06)}
  .fill{height:100%;background:linear-gradient(90deg,#FACC15,#FB923C);box-shadow:inset 0 1px 0 rgba(255,255,255,0.3)}
</style></head>
<body>
<div class="item"><div class="head"><span>Level 7 → 8</span><span class="num">820 / 1000 XP</span></div><div class="bar"><div class="fill" style="width:82%"></div></div></div>
<div class="item"><div class="head"><span>Level 12 → 13</span><span class="num">200 / 1500 XP</span></div><div class="bar"><div class="fill" style="width:13%"></div></div></div>
<div class="item"><div class="head"><span style="color:var(--lx-xp)">Level Up!</span><span class="num">1000 / 1000 XP</span></div><div class="bar"><div class="fill" style="width:100%;background:linear-gradient(90deg,#FACC15,#FBBF24,#FACC15);box-shadow:0 0 16px rgba(250,204,21,0.6)"></div></div></div>
</body></html>
