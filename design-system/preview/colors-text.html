<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:28px}
  .row{display:flex;gap:14px;align-items:stretch}
  .sw{flex:1;border-radius:16px;padding:18px;background:#1E293B;border:1px solid var(--lx-border);display:flex;flex-direction:column;gap:8px}
  .sw .sample{font-family:var(--lx-font-display);font-weight:800;font-size:22px}
  .sw .label{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--lx-fg3)}
  .sw .hex{font-family:var(--lx-font-mono);font-size:11px;color:var(--lx-fg3)}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="sample" style="color:#F8FAFC">Headings</div><div class="label">FG1</div><div class="hex">#F8FAFC</div></div>
  <div class="sw"><div class="sample" style="color:#CBD5E1;font-weight:500">Body text</div><div class="label">FG2</div><div class="hex">#CBD5E1</div></div>
  <div class="sw"><div class="sample" style="color:#94A3B8;font-weight:500">Muted caption</div><div class="label">FG3</div><div class="hex">#94A3B8</div></div>
</div>
</body></html>
