<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:24px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .sw{border-radius:16px;padding:14px;height:120px;display:flex;flex-direction:column;justify-content:space-between;color:#0F172A;font-family:var(--lx-font-body);box-shadow:var(--lx-shadow-card)}
  .sw .name{font-weight:800;font-size:13px}
  .sw .hex{font-family:var(--lx-font-mono);font-size:11px;opacity:0.85}
  .sw .icon{font-size:22px}
</style></head>
<body>
<div class="grid">
  <div class="sw" style="background:#FACC15"><div class="icon">⭐</div><div><div class="name">XP</div><div class="hex">#FACC15</div></div></div>
  <div class="sw" style="background:#FB923C"><div class="icon">🔥</div><div><div class="name">Streak</div><div class="hex">#FB923C</div></div></div>
  <div class="sw" style="background:#FB7185"><div class="icon">❤️</div><div><div class="name">Heart</div><div class="hex">#FB7185</div></div></div>
  <div class="sw" style="background:#FBBF24"><div class="icon">🏆</div><div><div class="name">League</div><div class="hex">#FBBF24</div></div></div>
  <div class="sw" style="background:#38BDF8"><div class="icon">💎</div><div><div class="name">Gem</div><div class="hex">#38BDF8</div></div></div>
</div>
</body></html>
