<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body{padding:24px;display:flex;flex-direction:column;gap:6px;max-width:380px;margin:0 auto;font-family:var(--lx-font-display)}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#1E293B;border:1px solid rgba(255,255,255,0.04)}
  .row.you{background:rgba(79,70,229,0.18);border:2px solid #4F46E5;box-shadow:0 8px 24px rgba(99,102,241,0.25)}
  .rank{width:28px;text-align:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
  .av{width:38px;height:38px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:inset 0 -2px 4px rgba(0,0,0,0.15)}
  .nm{flex:1;font-weight:700;font-size:14px;color:#CBD5E1}
  .nm b{color:#A5B4FC;font-size:11px;font-weight:600;margin-left:4px}
  .xp{font-weight:800;font-size:14px;color:#FACC15;font-variant-numeric:tabular-nums}
  .divider{display:flex;align-items:center;gap:8px;padding:8px 4px}
  .divider .line{flex:1;height:1px;background:rgba(34,197,94,0.3)}
  .divider .lbl{font-size:11px;font-weight:700;color:#22C55E;text-transform:uppercase;letter-spacing:0.08em}
</style></head>
<body>
<div class="row"><div class="rank" style="color:#FACC15">1</div><div class="av" style="background:#FB923C">A</div><div class="nm">Ahmed</div><div class="xp">2,450 XP</div></div>
<div class="row"><div class="rank" style="color:#FACC15">2</div><div class="av" style="background:#A855F7">S</div><div class="nm">Sara</div><div class="xp">2,380 XP</div></div>
<div class="row you"><div class="rank" style="color:#94A3B8">7</div><div class="av" style="background:#EF4444">S</div><div class="nm">Sami<b>YOU</b></div><div class="xp">1,240 XP</div></div>
<div class="divider"><div class="line"></div><div class="lbl">↑ Promotion Zone</div><div class="line"></div></div>
<div class="row"><div class="rank" style="color:#94A3B8">8</div><div class="av" style="background:#A855F7">H</div><div class="nm">Hassan</div><div class="xp">1,180 XP</div></div>
</body></html>
