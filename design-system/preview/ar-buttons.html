<!doctype html>
<html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="_base-ar.css">
<style>
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .btn{height:52px;border-radius:16px;border:none;font-family:'Cairo';font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform 120ms}
  .primary{background:#4F46E5;color:#fff;box-shadow:0 4px 12px rgba(99,102,241,0.4)}
  .success{background:#22C55E;color:#0F172A;box-shadow:0 4px 12px rgba(34,197,94,0.3)}
  .danger{background:#EF4444;color:#fff;box-shadow:0 4px 12px rgba(239,68,68,0.35)}
  .secondary{background:#334155;color:#F8FAFC;border:1px solid rgba(255,255,255,0.1)}
  .ghost{background:transparent;color:#CBD5E1;border:1px solid rgba(255,255,255,0.16)}
  .disabled{background:#1E293B;color:#64748B;cursor:not-allowed}
</style></head>
<body style="padding:28px">
<div class="grid">
  <button class="btn primary">ابدأ الدرس</button>
  <button class="btn success">متابعة</button>
  <button class="btn danger">استسلام</button>
  <button class="btn secondary">تخطي</button>
  <button class="btn ghost">لاحقاً</button>
  <button class="btn disabled">مقفل</button>
</div>
</body></html>
