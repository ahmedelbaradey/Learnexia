<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Learnexia · Student Mobile</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1a2348, #0b0f1e 70%);
    color: #F8FAFC;
    font-family: 'Poppins', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
    padding: 32px 16px 64px;
  }
  .crumbs {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  }
  .crumb {
    background: #1E293B; border: 1px solid rgba(255,255,255,0.08);
    color: #CBD5E1; padding: 8px 14px; border-radius: 9999px;
    font-weight: 700; font-size: 13px; cursor: pointer;
    transition: all 180ms cubic-bezier(0.16,1,0.3,1);
    font-family: inherit;
  }
  .crumb.active { background: #4F46E5; color: #fff; border-color: #6366F1; box-shadow: 0 6px 18px rgba(99,102,241,0.45); }
  .crumb:hover:not(.active) { background: #334155; }
  .hint {
    color: #94A3B8; font-size: 12px; text-align: center; max-width: 420px;
    letter-spacing: 0.02em;
  }
  /* in-screen animations */
  @keyframes lxpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes lxpop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
function DeviceShell({ children, dark = true }) {
  return (
    <div style={{
      width: 402, height: 874, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: '#0F172A',
      boxShadow: '0 40px 80px rgba(0,0,0,0.5), 0 0 0 12px #1a1a1a, 0 0 0 13px rgba(255,255,255,0.08)',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      <IOSStatusBar dark={true}/>
      <div style={{ position: 'absolute', top: 60, left: 0, right: 0, bottom: 0 }}>
        {children}
      </div>
      {/* home indicator */}
      <div style={{
        position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
        width: 139, height: 5, borderRadius: 100,
        background: 'rgba(255,255,255,0.7)', zIndex: 100,
      }}/>
    </div>
  );
}

function App() {
  const [screen, setScreen] = React.useState('home');
  const [tab, setTab] = React.useState('home');

  const screens = {
    home:    <HomeScreen onContinue={() => setScreen('lesson')} onMission={() => setScreen('missions')}/>,
    skills:  <SkillTreeScreen onStart={() => setScreen('lesson')}/>,
    lesson:  <LessonScreen onAsk={() => {}} onStart={() => setScreen('quiz')}/>,
    quiz:    <QuizScreen onComplete={() => setScreen('reward')}/>,
    reward:  <RewardScreen onDone={() => setScreen('home')}/>,
  };

  const tabToScreen = (id) => {
    setTab(id);
    if (id === 'home')   setScreen('home');
    if (id === 'skills') setScreen('skills');
  };

  return (
    <div className="stage" data-screen-label={`Mobile · ${screen}`}>
      <div className="crumbs">
        {[
          ['home', 'Home'],
          ['skills', 'Skill Tree'],
          ['lesson', 'Lesson'],
          ['quiz', 'Quiz'],
          ['reward', 'Reward'],
        ].map(([id, label]) => (
          <button key={id} className={`crumb${screen === id ? ' active' : ''}`} onClick={() => setScreen(id)}>{label}</button>
        ))}
      </div>
      <div style={{ position: 'relative' }}>
        <DeviceShell>
          {screens[screen]}
          {(screen === 'home' || screen === 'skills') && <TabBar active={tab} onChange={tabToScreen}/>}
        </DeviceShell>
      </div>
      <div className="hint">Tap any pill above to jump screens, or tap the purple <b>Continue</b> card on Home to run the lesson → quiz → reward flow.</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
