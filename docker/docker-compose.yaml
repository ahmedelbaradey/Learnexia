services:
  # PostgreSQL — MUST be a pgvector image: the Catalog module's migration runs `CREATE EXTENSION vector`
  # (and Phase-4 RAG will need it), which fails on a plain `postgres` image with
  # "extension vector is not available". Pinned to pg15 to match the deployed staging/prod server
  # (pgvector/pgvector:pg15) — keep dev↔prod on the same major version to avoid EF/migration drift.
  # Credentials/DB match appsettings.json ConnectionStrings:Default (Database=Learnexia, postgres/admin).
  postgres:
    image: pgvector/pgvector:pg15
    container_name: learnexia_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: Learnexia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - learnexia-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Learnexia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - learnexia-network

  # MinIO object storage (S3-compatible) — backs avatar upload/remove (P1-12 BE-4). The Identity
  # storage adapter talks the raw S3 HTTP API with hand-rolled AWS SigV4 (no MinIO SDK).
  minio:
    image: quay.io/minio/minio:latest
    container_name: learnexia-minio
    restart: always
    ports:
      - "9000:9000"   # MinIO API port
      - "9001:9001"   # MinIO Console (Web UI) port
    environment:
      # Default credentials (override these for production).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION: us-east-1
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - learnexia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # One-shot bucket bootstrap. Creates the `avatars` bucket. NO anonymous policy is set: avatars are
  # served via short-lived presigned GET URLs (SigV4), so the bucket stays private.
  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: learnexia-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Setting up MinIO alias...';
      /usr/bin/mc alias set learnexia-minio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      echo 'Creating the avatars bucket (private — served via presigned URLs)...';
      /usr/bin/mc mb learnexia-minio/avatars --ignore-existing;
      echo 'Creating the curriculum bucket (BL-01/BL-02 — uploaded files + parsed JSON artifacts; private)...';
      /usr/bin/mc mb learnexia-minio/curriculum --ignore-existing;
      echo 'MinIO setup completed. Console: http://localhost:9001';"
    networks:
      - learnexia-network

  # Learnexia API (the modular-monolith Host). Built from the repo root so the Dockerfile
  # can reach the whole `backend/` tree (build.context: .. relative to this docker/ folder).
  learnexia-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: learnexia-api
    restart: always
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - learnexia-network
    environment:
      # Inside the compose network the DB host is the service name, not localhost.
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=Learnexia;Username=postgres;Password=admin
      - ConnectionStrings__Redis=redis:6379
      - ASPNETCORE_Kestrel__Endpoints__Https__Url=https://+:8081
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:8080
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Endpoints__Https__Certificate__Password=123456
      # MinIO configuration for containerized environment
      - MinIOConfiguration__Endpoint=minio:9000
      - MinIOConfiguration__AccessKey=minioadmin
      - MinIOConfiguration__SecretKey=minioadmin
      - MinIOConfiguration__UseSSL=false
      - MinIOConfiguration__Enabled=true
    volumes:
      - ./aspnetapp.pfx:/https/aspnetapp.pfx:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      # Readiness probe — hits the API's /health endpoint (added in P1-07-BE-2).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  # AI-Gateway PLACEHOLDER (Phase 3 stub).
  # The real AI gateway (RAG / LLM proxy) is delivered in a later phase. For now this is a
  # no-op stub container so the service name + network slot are reserved and documented.
  # It does nothing but stay alive; replace the image/command when the gateway is built.
  # ---------------------------------------------------------------------------
  ai-gateway:
    image: alpine:3.20
    container_name: learnexia-ai-gateway
    command: ["sh", "-c", "echo 'AI-Gateway placeholder (Phase 3 stub) — replace in a later story'; sleep infinity"]
    ports:
      - "8090:8090"   # reserved port for the future AI gateway
    networks:
      - learnexia-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Curriculum-intelligence — the Python parsing worker (ADR-0004, BL-02).
  # First Python service in the repo. It is a LONG-RUNNING POLLER: it claims
  # `parse` jobs off the curriculum."PipelineJobs" DB-outbox, reads the source
  # file from the `curriculum` MinIO bucket, parses it into a normalized JSON
  # artifact (written back to the bucket), and advances the job to Done/Failed.
  # There is NO service-to-service HTTP with .NET — they meet only at the table.
  # A FastAPI /health endpoint runs in the same process for the healthcheck.
  #
  # Parser backend defaults to the deterministic MOCK (no external services).
  # To go live, devops sets PARSER_BACKEND=azure_di + the AZURE_DI_* / ANTHROPIC
  # secrets via ${VAR} references (never committed) and rebuilds with EXTRAS=live.
  # ---------------------------------------------------------------------------
  curriculum-intelligence:
    build:
      context: ../python/curriculum_intelligence
      dockerfile: Dockerfile
    container_name: learnexia-curriculum-intelligence
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - learnexia-network
    environment:
      # Same Postgres the .NET backend uses (curriculum schema).
      - DATABASE_URL=postgresql://postgres:admin@postgres:5432/Learnexia
      - CURRICULUM_SCHEMA=curriculum
      # Same MinIO creds as MinIOConfiguration; reads/writes the curriculum bucket.
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_USE_SSL=false
      - CURRICULUM_BUCKET=curriculum
      # Parser backend: mock by default; flip to azure_di once provisioned.
      - PARSER_BACKEND=${PARSER_BACKEND:-mock}
      # Edge inferer (BL-03): mock by default; flip to lightrag once provisioned.
      - INFERER_BACKEND=${INFERER_BACKEND:-mock}
      # DEVOPS-GATED secrets — empty in dev; injected via ${VAR}, NEVER committed.
      - AZURE_DI_ENDPOINT=${AZURE_DI_ENDPOINT:-}
      - AZURE_DI_KEY=${AZURE_DI_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - POLL_INTERVAL_SECONDS=5
      - HEALTH_PORT=8091
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8091/health'); sys.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # WEB FRONTEND — PLACEHOLDER ONLY (deferred to P1-09).
  # The Expo/Turborepo web app is not dockerized yet. Uncomment and complete this block
  # in P1-09 once the frontend Dockerfile lands.
  #
  # web-frontend:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.web   # TODO (P1-09): create the FE Dockerfile
  #   container_name: learnexia-web
  #   restart: always
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     learnexia-api:
  #       condition: service_healthy
  #   networks:
  #     - learnexia-network
  # ---------------------------------------------------------------------------

volumes:
  minio_data:
    driver: local

  postgres_data:

networks:
  learnexia-network:
    driver: bridge
