[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curriculum-intelligence"
version = "0.1.0"
description = "Learnexia curriculum-intelligence parsing worker — DB-outbox poller that OCR/parses uploaded curriculum files into normalized JSON artifacts (ADR-0004)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Learnexia" }]

# Lean, pinned core runtime deps. Heavy OCR/AI deps (azure-ai-documentintelligence,
# RAG-Anything/LightRAG, mineru, paddleocr, anthropic) are devops-gated and live in
# the optional [live] extra — the mock default needs none of them.
dependencies = [
    "psycopg[binary]==3.2.3",
    "boto3==1.35.71",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
]

[project.optional-dependencies]
# Installed only at the devops "go live" flip (Azure DI provisioned + benchmark passed).
# RAG-Anything (HKUDS) + LightRAG are MIT-licensed — confirmed before adoption (PY-1 license gate);
# pin exact versions when provisioning.
live = [
    "azure-ai-documentintelligence==1.0.0",
    # anthropic drives both the Claude hierarchy extractor (BL-05) and the LightRAG
    # edge inferer's LLM step (BL-03); the LightRAG graph store (lightrag-hku) is a
    # devops follow-up pinned at provisioning time.
    "anthropic==0.40.0",
    # "raganything", "lightrag-hku", "mineru", "paddleocr" — pin at provisioning time.
]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "testcontainers[postgres]==4.8.2",
]
dev = [
    "ruff==0.8.4",
    "black==24.10.0",
]

[project.scripts]
curriculum-intelligence = "curriculum_intelligence.main:main"

[tool.setuptools]
packages = [
    "curriculum_intelligence",
    "curriculum_intelligence.app",
    "curriculum_intelligence.parsers",
    "curriculum_intelligence.ingestion",
    "curriculum_intelligence.inference",
    "curriculum_intelligence.workers",
    "curriculum_intelligence.benchmarks",
]

[tool.setuptools.package-dir]
"curriculum_intelligence" = "."

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: Postgres (Testcontainers) outbox contract test — requires Docker",
]
